<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Select a Body part</title>
  <link rel="stylesheet" href="Body_parts.css" />
</head>

<body>
    <div class="header">
            <button id="custom" class="custom" onclick="window.location.href='custom_exercise.html'">
                <h3>Add Exercise</h3>
            </button>
            <h1>Urban Yogi Lifestyle</h1>
            <div style="align-self: center;">
                <p>
                    <a href="about_page.html" style="text-decoration: none; color: white;margin-right: 20px;">Username
                    <img src="icons/user-icon.png" alt="user_icon" class="user"></a>
                </p>        
            </div>
    </div>
    <div class = "wrapper" style="margin-top: 5vh">
        <h1>Select a Body part to Train</h1>
        <div class="button-container">  
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Head`">Head</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Neck`">Neck</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Shoulders`">Shoulders</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Chest`">Chest</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Back`">Back</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Abdomen`">Abdomen</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Spine`">Spine</button>
            <button onclick="window.location.href=`exercise_description.html?diff=${diff}&focuus=${focuus}&part=Ankles`">Ankles</button>
        </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search)
      const diff = params.get('diff')
      const focuus = params.get('focuus')
    </script>
</body>
</html>
