<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warm Welcome</title>
  <style>
    :root {
      --bg: #FFFBF0;
      --card: #FFF4E0;
      --text: #4B2E2E;
      --accent: #F97316;
      --muted: #7C5E57;
    }

    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      background-color: var(--card);
      align-items: center;
    }

    header {
      background-color: var(--accent);
      color: white;
      padding: 1.5rem 2rem;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
      font-weight: bold;
    }

    main {
      margin-top: 3rem;
      padding: 2rem;
      border-radius: 1.25rem;
      background-color:#FFFBF0;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    h2 {
      color: var(--accent);
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .btn {
      margin-top: 2rem;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #EA580C; /* deeper orange */
    }
  </style>
</head>
<body>

  <header>
    Warm Welcome
  </header>

  <main>
    <h2>Cozy & Inviting</h2>
    <p>
      This layout uses a soft peach and burnt orange palette to create warmth and comfort. Perfect for heartfelt content, handmade crafts, or storytelling.
    </p>
    <button class="btn">Get Started</button>
  </main>

</body>
</html>
