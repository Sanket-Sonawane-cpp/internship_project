<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Select a Body part</title>
  <link rel="stylesheet" href="Body_parts.css" />
</head>

<body>
    <div class = "wrapper">
        <h1 style="text-align: center;">Select a Body part to Train</h1>
       
            <button class="btn" onclick="mclick(`Head`)" onmouseenter="mouseover(`headProg`)" onmouseleave="mouseleaves(`headProg`)">Head <p style="display: none;" id="headProg"></p></button>
            <button class="btn" onclick="mclick(`Neck`)" onmouseenter="mouseover(`neckProg`)" onmouseleave="mouseleaves(`neckProg`)">Neck <p style="display: none;" id="neckProg"></p></button>
            <button class="btn" onclick="mclick(`Shoulders`)" onmouseenter="mouseover(`shoulderProg`)" onmouseleave="mouseleaves(`shoulderProg`)">Shoulders <p style="display: none;" id="shoulderProg"></p></button>
            <button class="btn" onclick="mclick(`Arms`)" onmouseenter="mouseover(`armsProg`)" onmouseleave="mouseleaves(`armsProg`)">Arms <p style="display: none;" id="armsProg"></p></button>
            <button class="btn" onclick="mclick(`Back`)" onmouseenter="mouseover(`backProg`)" onmouseleave="mouseleaves(`backProg`)">Back <p style="display: none;" id="backProg"></p></button>
            <button class="btn" onclick="mclick(`Core`)" onmouseenter="mouseover(`coreProg`)" onmouseleave="mouseleaves(`coreProg`)">Core <p style="display: none;" id="coreProg"></p></button>
            <button class="btn" onclick="mclick(`Legs`)" onmouseenter="mouseover(`legsProg`)" onmouseleave="mouseleaves(`legsProg`)">Legs <p style="display: none;" id="legsProg"></p></button>
            <button class="btn" onclick="mclick(`Ankles`)" onmouseenter="mouseover(`anklesProg`)" onmouseleave="mouseleaves(`anklesProg`)">Ankles <p style="display: none;" id="anklesProg"></p></button>

    </div>
    <script src="Body_parts.js"></script>
</body>
</html>
